name: Android CI

# 目的：在未安装本地 Android SDK 的机器上也能获得完整、真实的编译结论。
#
# 关于 Android SDK：
# 不依赖 android-actions/setup-android。该 action 会执行 `sdkmanager tools`，
# 而 `tools` 包已从新版 SDK 仓库移除（cmdline-tools 16.0 起），会直接失败：
#   Warning: Failed to find package 'tools'  →  exit code 1
# ubuntu-latest runner 已预装完整的 Android SDK，因此直接使用它，
# 只补齐本工程需要的 Platform 与 Build-Tools。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 源码编译只需要 Platform 与 Build-Tools；platform-tools 已预装。
      - name: Install Platform 36 & Build-Tools 36.0.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      # 只需要 Gradle 发行版缓存；实际构建走仓库内的 ./gradlew，版本由 Wrapper 决定。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 单测是纯 JVM 的（排版计算不依赖 Android），不需要模拟器
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
