name: Android CI

# 目的：在未安装本地 Android SDK 的机器上也能获得完整、真实的编译结论。
#
# 注意：本仓库不包含 gradle/wrapper/gradle-wrapper.jar 与 gradlew 脚本
# （生成它们需要联网下载 Gradle 发行版），因此 CI 中直接调用全局 `gradle` 命令，
# 而不是 `./gradlew`。若后续将 Wrapper 二进制提交进仓库，可改用 `./gradlew`。
# 下方的「Generate Gradle Wrapper」步骤仅用于产出可回存的 Wrapper 文件，
# 失败不影响后续构建。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 装编译真正需要的两个包。platform-tools 由 setup-android 负责，这里只补平台和构建工具。
      - name: Install platform 36 & build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 仓库里没有 wrapper 二进制（生成它需要联网），在 CI 里补上：
      # 失败也不影响后面的编译，因为编译走的是全局 gradle 命令。
      - name: Generate Gradle Wrapper
        continue-on-error: true
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin

      # 单测是纯 JVM 的（排版计算不依赖 Android），不需要模拟器
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
